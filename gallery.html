{% extends "base.html" %}{% block title %}Gallery{% endblock %}
{% block content %}
<section class="wrap page"><h1>Gallery</h1>
<p class="lead">Moments from flights across Georgia's mountains, valleys and skies.</p>
<div class="masonry">{% for n in range(1,22) %}
<img src="{{ url_for('static', filename='images/para%d.jpg'|format(n)) }}" alt="Paragliding in Georgia, photo {{ n }}" loading="lazy" tabindex="0">{% endfor %}</div></section>
<div id="lightbox" class="lightbox" hidden><img alt=""></div>
{% endblock %}
