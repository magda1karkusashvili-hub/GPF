{% extends "base.html" %}{% block title %}Dashboard{% endblock %}
{% block content %}
<section class="wrap page"><h1>Flight dashboard</h1>
<p class="lead">Booking requests received by the Federation.</p>
<div class="stats"><div><b>{{ total }}</b><span>total requests</span></div>
{% for s,n in c.items() %}<div><b>{{ n }}</b><span>{{ s|lower }}</span></div>{% endfor %}</div>
<a class="btn sm ghost" href="{{ url_for('login') }}">Admin login</a></section>
{% endblock %}
