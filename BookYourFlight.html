{% extends "base.html" %}{% block title %}Book a flight{% endblock %}
{% block content %}
<section class="wrap page narrow"><h1>Book your flight</h1>
<p class="lead">Choose a location and date. We confirm by phone or email.</p>
<form method="post" class="form card">
<label>Location<select name="location" required><option value="">Select location</option>{% for l in locations %}<option>{{ l }}</option>{% endfor %}</select></label>
<label>Preferred date<input type="date" name="date" min="{{ today }}" required></label>
<label>Full name<input name="name" autocomplete="name" required></label>
<label>Email<input type="email" name="email" autocomplete="email" placeholder="you@example.com" required></label>
<label>Phone<input type="tel" name="phone" autocomplete="tel" placeholder="+995..." required></label>
<p class="note">Flights depend on weather conditions and pilot availability.</p>
<button class="btn">Send booking request</button></form></section>
{% endblock %}
